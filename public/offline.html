<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Offline / オフライン</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #f7f7f5; color: #1c1f1d; text-align: center; padding: 24px; }
        button { margin-top: 16px; min-height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid #d4d6d3; background: #fff; font-size: 15px; }
    </style>
</head>
<body>
    <main>
        <h1>オフラインです</h1>
        <p>インターネット接続を確認して、もう一度お試しください。</p>
        <p>You are offline. Please check your connection and try again.</p>
        <button type="button" onclick="location.reload()">再読み込み / Retry</button>
    </main>
</body>
</html>
